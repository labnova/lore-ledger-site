name: deploy
# Build (prerender) e deploy su Azure Static Web Apps a ogni push su main, compresi i commit di
# soli dati (public/data/**) spinti dal repo privato tramite SITE_PUSH_TOKEN.
# Secret richiesto in questo repo: AZURE_STATIC_WEB_APPS_API_TOKEN (vedi README, sezione Azure).
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
permissions: { contents: read }
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/lore-ledger-site/browser
          skip_app_build: true
          skip_api_build: true
